name: Verify Release Readiness

'on':
  push:
    branches:
      - main
      - 'ui/**'
      - 'release/**'
  pull_request:
    branches:
      - main
      - 'release/**'

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      TZ: 'Africa/Algiers'
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.7'
          channel: 'stable'
          cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: flutter pub get

      - name: Preflight & Environment Record
        run: |
          set -o pipefail
          mkdir -p build/ci-logs/gates
          echo "=== Release Readiness Preflight Record ===" | tee build/ci-logs/preflight.log
          echo "Commit SHA: ${{ github.sha }}" | tee -a build/ci-logs/preflight.log
          echo "Ref:        ${{ github.ref }}" | tee -a build/ci-logs/preflight.log
          echo "Run ID:     ${{ github.run_id }}" | tee -a build/ci-logs/preflight.log
          echo "Date (UTC): $(date -u '+%Y-%m-%d %H:%M:%S UTC')" | tee -a build/ci-logs/preflight.log
          echo "--- Git Commit Info ---" | tee -a build/ci-logs/preflight.log
          git log -1 --format="Commit:  %H%nAuthor:  %an <%ae>%nDate:    %ad%nSubject: %s" | tee -a build/ci-logs/preflight.log
          echo "--- Git Clean Status ---" | tee -a build/ci-logs/preflight.log
          git status --porcelain | tee build/ci-logs/git-status.log
          cat build/ci-logs/git-status.log | tee -a build/ci-logs/preflight.log
          echo "--- Tool Versions ---" | tee -a build/ci-logs/preflight.log
          flutter --version | tee build/ci-logs/flutter-version.log
          cat build/ci-logs/flutter-version.log | tee -a build/ci-logs/preflight.log
          java -version 2>&1 | tee build/ci-logs/java-version.log
          cat build/ci-logs/java-version.log | tee -a build/ci-logs/preflight.log
          echo "==========================================" | tee -a build/ci-logs/preflight.log

      - name: Gate 1 - Static Analysis
        if: always()
        run: |
          set -o pipefail
          mkdir -p build/ci-logs/gates
          status=0
          flutter analyze --no-pub 2>&1 | tee build/ci-logs/analyze.log || status=$?
          echo "$status" > build/ci-logs/gates/01_analyze.status
          if [ "$status" -ne 0 ]; then
            echo "Gate 1 (Static Analysis) failed with exit code $status"
            exit "$status"
          fi

      - name: Gate 2 - UI Strict Lint V2
        if: always()
        run: |
          set -o pipefail
          mkdir -p build/ci-logs/gates
          status=0
          python tool/ui_lint_v2.py --strict 2>&1 | tee build/ci-logs/ui-lint-v2.log || status=$?
          echo "$status" > build/ci-logs/gates/02_ui_lint.status
          if [ "$status" -ne 0 ]; then
            echo "Gate 2 (UI Lint V2) failed with exit code $status"
            exit "$status"
          fi

      - name: Gate 3 - Automated Test Suite
        if: always()
        run: |
          set -o pipefail
          mkdir -p build/ci-logs/gates
          status=0
          flutter test --no-pub 2>&1 | tee build/ci-logs/tests.log || status=$?
          echo "$status" > build/ci-logs/gates/03_tests.status
          if [ "$status" -ne 0 ]; then
            echo "Gate 3 (Automated Tests) failed with exit code $status"
            exit "$status"
          fi

      - name: Gate 4 - Tool Regression Tests
        if: always()
        run: |
          set -o pipefail
          mkdir -p build/ci-logs/gates
          status=0
          python tool/test_release_readiness_checks.py 2>&1 | tee build/ci-logs/readiness-tests.log || status=$?
          echo "$status" > build/ci-logs/gates/04_readiness_tests.status
          if [ "$status" -ne 0 ]; then
            echo "Gate 4 (Readiness Tool Tests) failed with exit code $status"
            exit "$status"
          fi

      - name: Gate 5 - Debug APK Compilation
        if: always()
        run: |
          set -o pipefail
          mkdir -p build/ci-logs/gates
          status=0
          flutter build apk --debug --no-pub 2>&1 | tee build/ci-logs/build-debug.log || status=$?
          echo "$status" > build/ci-logs/gates/05_build_debug.status
          if [ "$status" -ne 0 ]; then
            echo "Gate 5 (Debug APK Compilation) failed with exit code $status"
            exit "$status"
          fi

      - name: Gate 6 - Test-Signed Release AAB & Signer Verification
        if: always()
        run: |
          set -o pipefail
          mkdir -p build/ci-logs/gates
          status=0
          python tool/run_release_readiness_checks.py --only-bundle 2>&1 | tee build/ci-logs/release-bundle.log || status=$?
          echo "$status" > build/ci-logs/gates/06_release_bundle.status
          if [ "$status" -ne 0 ]; then
            echo "Gate 6 (Release AAB & Signer Check) failed with exit code $status"
            exit "$status"
          fi

      - name: Gate 7 - Fail-Closed Android Signing Verification
        if: always()
        run: |
          set -o pipefail
          mkdir -p build/ci-logs/gates
          status=0
          python tool/verify_android_signing_fail_closed.py 2>&1 | tee build/ci-logs/signing-fail-closed.log || status=$?
          echo "$status" > build/ci-logs/gates/07_signing_fail_closed.status
          if [ "$status" -ne 0 ]; then
            echo "Gate 7 (Fail-Closed Signing Verification) failed with exit code $status"
            exit "$status"
          fi

      - name: Generate GitHub Step Summary
        if: always()
        run: |
          echo "## Release Readiness Verification Summary" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Branch / Ref:** \`${{ github.ref }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Gate | Status | Log Artifact |" >> $GITHUB_STEP_SUMMARY
          echo "| :--- | :--- | :--- |" >> $GITHUB_STEP_SUMMARY

          gates=(
            "01_analyze:Gate 1 - Static Analysis:analyze.log"
            "02_ui_lint:Gate 2 - UI Strict Lint V2:ui-lint-v2.log"
            "03_tests:Gate 3 - Automated Test Suite:tests.log"
            "04_readiness_tests:Gate 4 - Readiness Tool Regressions:readiness-tests.log"
            "05_build_debug:Gate 5 - Debug APK Compilation:build-debug.log"
            "06_release_bundle:Gate 6 - Release AAB & Signer Check:release-bundle.log"
            "07_signing_fail_closed:Gate 7 - Fail-Closed Signing:signing-fail-closed.log"
          )
          for entry in "${gates[@]}"; do
            id=$(echo "$entry" | cut -d':' -f1)
            name=$(echo "$entry" | cut -d':' -f2)
            log=$(echo "$entry" | cut -d':' -f3)
            status_file="build/ci-logs/gates/${id}.status"
            if [ -f "$status_file" ]; then
              code=$(cat "$status_file" | tr -d '[:space:]')
              if [ "$code" -eq 0 ]; then
                badge="✅ Passed"
              else
                badge="❌ Failed (code $code)"
              fi
            else
              badge="⚠️ Not run / missing"
            fi
            echo "| $name | $badge | \`$log\` |" >> $GITHUB_STEP_SUMMARY
          done

      - name: Upload Verification Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-logs-${{ github.sha }}
          path: build/ci-logs/
          retention-days: 14

      - name: Aggregate Final Release Gate Verdict
        if: always()
        run: |
          echo "=== Final Release Gate Verification Verdict ==="
          failed=0
          required_gates=(
            "01_analyze"
            "02_ui_lint"
            "03_tests"
            "04_readiness_tests"
            "05_build_debug"
            "06_release_bundle"
            "07_signing_fail_closed"
          )
          for gate in "${required_gates[@]}"; do
            status_file="build/ci-logs/gates/${gate}.status"
            if [ ! -f "$status_file" ]; then
              echo "❌ Gate missing: $gate was not executed"
              failed=1
            else
              code=$(cat "$status_file" | tr -d '[:space:]')
              if [ "$code" -ne 0 ]; then
                echo "❌ Gate failed: $gate (exit code $code)"
                failed=1
              else
                echo "✅ Gate passed: $gate"
              fi
            fi
          done
          if [ "$failed" -ne 0 ]; then
            echo ""
            echo "CRITICAL: One or more release gates failed! Rejecting build."
            exit 1
          fi
          echo ""
          echo "SUCCESS: All release readiness gates passed cleanly!"
