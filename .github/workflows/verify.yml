name: Verify Release Readiness

on:
  push:
    branches:
      - main
      - 'ui/**'
  pull_request:
    branches:
      - main

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.7'
          channel: 'stable'
          cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: flutter pub get

      - name: Gate 1 - Static Analysis
        run: |
          mkdir -p build/ci-logs
          flutter analyze 2>&1 | tee build/ci-logs/analyze.log

      - name: Gate 2 - UI Lint V2
        run: python tool/ui_lint_v2.py 2>&1 | tee build/ci-logs/ui-lint-v2.log

      - name: Gate 3 - Automated Test Suite
        run: flutter test 2>&1 | tee build/ci-logs/tests.log

      - name: Gate 4 - Debug APK Compilation
        run: flutter build apk --debug 2>&1 | tee build/ci-logs/build-debug.log

      - name: Upload Verification Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-logs
          path: build/ci-logs/
          retention-days: 14
