name: Build iOS App

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - 'codex/**'
      - 'ui/**'
      - 'ci/**'
    paths:
      - 'lib/**'
      - 'ios/**'
      - 'assets/**'
      - 'test/**'
      - 'pubspec.yaml'
      - '.github/workflows/build_ios.yml'

jobs:
  build-ios:
    name: Build iOS IPA & Runner.app
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Build iOS App (Release, No CodeSign)
        run: |
          set -o pipefail
          flutter precache --ios
          flutter build ios --release --no-codesign 2>&1 | tee flutter_build.log

      - name: Package into IPA for Sideloadly / AltStore
        run: |
          mkdir -p build/ios/ipa_payload/Payload
          cp -R build/ios/iphoneos/Runner.app build/ios/ipa_payload/Payload/
          cd build/ios/ipa_payload
          zip -yr ../talib_ilm_ios.ipa Payload
          cd ../../..

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: talib-ilm-ios-ipa
          path: build/ios/talib_ilm_ios.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Compress Runner.app for Simulator / Direct Testing
        run: |
          cd build/ios/iphoneos
          zip -yr ../Runner.app.zip Runner.app
          cd ../../..

      - name: Upload Runner.app.zip Artifact
        uses: actions/upload-artifact@v4
        with:
          name: talib-ilm-runner-app
          path: build/ios/Runner.app.zip
          if-no-files-found: error
          retention-days: 14

      - name: Upload Build Log Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flutter-build-log
          path: flutter_build.log
          if-no-files-found: ignore
          retention-days: 14

      - name: Dump Build Failure Diagnostics
        if: failure()
        run: |
          echo "=== Xcode & Flutter Diagnostic Logs ==="
          if [ -f flutter_build.log ]; then
            echo "--- Last 200 lines of flutter_build.log ---"
            tail -n 200 flutter_build.log
          fi
          find ~/Library/Developer/Xcode/DerivedData -name "*.log" -exec cat {} + 2>/dev/null | tail -n 200 || true
          find build/ios -name "*.log" -exec cat {} + 2>/dev/null | tail -n 200 || true
