name: Build iOS App

'on':
  workflow_dispatch:
  push:
    branches:
      - main
      - 'codex/**'
      - 'ui/**'
      - 'ci/**'
      - 'release/**'
      - 'remediation/**'
    paths:
      - 'lib/**'
      - 'ios/**'
      - 'assets/**'
      - 'test/**'
      - 'pubspec.yaml'
      - '.github/workflows/build_ios.yml'

jobs:
  build-ios:
    name: Build iOS IPA & Runner.app
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Precache iOS Artifacts
        run: flutter precache --ios

      - name: Configure Production Apple Signing (if secrets present)
        id: apple-signing
        if: ${{ secrets.APPLE_CERTIFICATE_BASE64 != '' }}
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          BUILD_PROVISION_PROFILE_APP: ${{ secrets.PROVISIONING_PROFILE_BASE64 }}
          BUILD_PROVISION_PROFILE_WIDGET: ${{ secrets.PROVISIONING_PROFILE_WIDGET_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD || 'temporary-ci-keychain-pass' }}
        run: |
          set -euo pipefail
          echo "=== Setting up Apple Distribution Signing Keychain ==="
          CERTIFICATE_PATH=$RUNNER_TEMP/build_certificate.p12
          PP_PATH_APP=$RUNNER_TEMP/build_pp_app.mobileprovision
          PP_PATH_WIDGET=$RUNNER_TEMP/build_pp_widget.mobileprovision
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db

          # Import certificate from secret
          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o "$CERTIFICATE_PATH"

          # Create temporary keychain
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          # Import certificate to keychain
          security import "$CERTIFICATE_PATH" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"

          # Install provisioning profiles
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          if [ -n "$BUILD_PROVISION_PROFILE_APP" ]; then
            echo -n "$BUILD_PROVISION_PROFILE_APP" | base64 --decode -o "$PP_PATH_APP"
            cp "$PP_PATH_APP" ~/Library/MobileDevice/Provisioning\ Profiles/
          fi
          if [ -n "$BUILD_PROVISION_PROFILE_WIDGET" ]; then
            echo -n "$BUILD_PROVISION_PROFILE_WIDGET" | base64 --decode -o "$PP_PATH_WIDGET"
            cp "$PP_PATH_WIDGET" ~/Library/MobileDevice/Provisioning\ Profiles/
          fi
          echo "SIGNED_BUILD_CONFIGURED=true" >> "$GITHUB_ENV"

      - name: Build Signed iOS IPA (when signing configured)
        if: env.SIGNED_BUILD_CONFIGURED == 'true'
        run: |
          flutter build ipa --release --export-options-plist=ios/ExportOptions.plist --no-tree-shake-icons

      - name: Build Unsigned iOS App (when signing credentials absent)
        if: env.SIGNED_BUILD_CONFIGURED != 'true'
        run: |
          echo "=== Building release bundle with --no-codesign for testing and sideloading ==="
          export FLUTTER_XCODE_DEVELOPMENT_TEAM="V3N9W8G24A"
          flutter build ios --release --no-codesign --no-tree-shake-icons

      - name: Verify embedded WidgetKit extension
        run: |
          set -euo pipefail
          APP_DIR="build/ios/iphoneos/Runner.app"
          APPEX_DIR="$APP_DIR/PlugIns/TalibIlmWidgets.appex"

          test -d "$APPEX_DIR"
          test -s "$APPEX_DIR/TalibIlmWidgets"
          /usr/bin/plutil -lint "$APPEX_DIR/Info.plist"

          APP_ID=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP_DIR/Info.plist")
          EXTENSION_ID=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APPEX_DIR/Info.plist")
          EXECUTABLE=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$APPEX_DIR/Info.plist")
          EXTENSION_POINT=$(/usr/libexec/PlistBuddy -c 'Print :NSExtension:NSExtensionPointIdentifier' "$APPEX_DIR/Info.plist")

          test "$APP_ID" = "com.talibilm.app"
          test "$EXTENSION_ID" = "$APP_ID.widgets"
          test "$EXECUTABLE" = "TalibIlmWidgets"
          test "$EXTENSION_POINT" = "com.apple.widgetkit-extension"
          echo "Verified WidgetKit extension: $EXTENSION_ID ($EXECUTABLE)"

      - name: Ensure Notification Audio Assets in Runner Bundle
        run: |
          echo "=== Copying all notification sounds to Runner.app bundle ==="
          APP_DIR="build/ios/iphoneos/Runner.app"
          mkdir -p "$APP_DIR/Library/Sounds"
          mkdir -p "$APP_DIR/NotificationSounds"
          cp -fv ios/Runner/NotificationSounds/*.caf "$APP_DIR/"
          cp -fv ios/Runner/NotificationSounds/*.caf "$APP_DIR/Library/Sounds/"
          cp -fv ios/Runner/NotificationSounds/*.caf "$APP_DIR/NotificationSounds/"
          echo "=== Notification sounds in Runner.app root: ==="
          ls -la "$APP_DIR"/*.caf

      - name: Package into IPA for Sideloadly / AltStore (Unsigned Mode)
        if: env.SIGNED_BUILD_CONFIGURED != 'true'
        run: |
          mkdir -p build/ios/ipa_payload/Payload
          cp -R build/ios/iphoneos/Runner.app build/ios/ipa_payload/Payload/
          cd build/ios/ipa_payload
          zip -yr ../talib_ilm_ios.ipa Payload
          cd ../../..

      - name: Upload Unsigned IPA Artifact
        if: env.SIGNED_BUILD_CONFIGURED != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: talib-ilm-ios-unsigned-ipa
          path: build/ios/talib_ilm_ios.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Upload Signed Production IPA Artifact
        if: env.SIGNED_BUILD_CONFIGURED == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: talib-ilm-ios-signed-ipa
          path: build/ios/ipa/*.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Compress Runner.app for Simulator / Direct Testing
        run: |
          cd build/ios/iphoneos
          zip -yr ../Runner.app.zip Runner.app
          cd ../../..

      - name: Upload Runner.app.zip Artifact
        uses: actions/upload-artifact@v4
        with:
          name: talib-ilm-Runner.app.zip
          path: build/ios/Runner.app.zip
          if-no-files-found: error
          retention-days: 14
