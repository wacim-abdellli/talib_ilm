name: Build iOS App

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - 'codex/**'
      - 'ui/**'
      - 'ci/**'
    paths:
      - 'lib/**'
      - 'ios/**'
      - 'assets/**'
      - 'test/**'
      - 'pubspec.yaml'
      - '.github/workflows/build_ios.yml'

jobs:
  build-ios:
    name: Build iOS IPA & Runner.app
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        id: flutter-action
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Build iOS App (Release, No CodeSign)
        run: |
          flutter precache --ios
          export FLUTTER_ROOT="$(dirname $(dirname $(which flutter)))"
          export FLUTTER_XCODE_DEVELOPMENT_TEAM="V3N9W8G24A"
          echo "FLUTTER_ROOT is: $FLUTTER_ROOT"
          
          echo "=== 1. Preparing Flutter Configuration and CocoaPods ==="
          flutter build ios --config-only --no-codesign
          
          echo "=== 2. Building Release iOS Bundle without Code Signing ==="
          flutter build ios --release --no-codesign || {
            echo "=== Flutter CLI exited; compiling via direct xcodebuild invocation ==="
            xcodebuild -workspace ios/Runner.xcworkspace \
                       -scheme Runner \
                       -configuration Release \
                       -sdk iphoneos \
                       -destination 'generic/platform=iOS' \
                       FLUTTER_ROOT="$FLUTTER_ROOT" \
                       DEVELOPMENT_TEAM=V3N9W8G24A \
                       CODE_SIGN_STYLE=Manual \
                       CODE_SIGNING_ALLOWED=NO \
                       CODE_SIGNING_REQUIRED=NO \
                       CODE_SIGN_IDENTITY="" \
                       ENABLE_USER_SCRIPT_SANDBOXING=NO \
                       build
          }

          echo "=== 3. Locating built Runner.app ==="
          if [ ! -d "build/ios/iphoneos/Runner.app" ]; then
            FOUND_APP=$(find build/ios ~/Library/Developer/Xcode/DerivedData -name "Runner.app" -type d 2>/dev/null | head -n 1)
            if [ -n "$FOUND_APP" ]; then
              echo "Found Runner.app at: $FOUND_APP"
              mkdir -p build/ios/iphoneos
              cp -R "$FOUND_APP" build/ios/iphoneos/Runner.app
            fi
          fi
          
          if [ ! -d "build/ios/iphoneos/Runner.app" ]; then
            echo "ERROR: Runner.app not found in build outputs!"
            find build/ios -maxdepth 4 -ls || true
            exit 1
          fi
          echo "Runner.app successfully ready for packaging!"

      - name: Package into IPA for Sideloadly / AltStore
        run: |
          mkdir -p build/ios/ipa_payload/Payload
          cp -R build/ios/iphoneos/Runner.app build/ios/ipa_payload/Payload/
          cd build/ios/ipa_payload
          zip -yr ../talib_ilm_ios.ipa Payload
          cd ../../..

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: talib-ilm-ios-ipa
          path: build/ios/talib_ilm_ios.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Compress Runner.app for Simulator / Direct Testing
        run: |
          cd build/ios/iphoneos
          zip -yr ../Runner.app.zip Runner.app
          cd ../../..

      - name: Upload Runner.app.zip Artifact
        uses: actions/upload-artifact@v4
        with:
          name: talib-ilm-runner-app
          path: build/ios/Runner.app.zip
          if-no-files-found: error
          retention-days: 14

      - name: Dump Build Failure Diagnostics
        if: failure()
        run: |
          echo "=== Xcode & Flutter Diagnostic Logs ==="
          find ~/Library/Developer/Xcode/DerivedData -name "*.log" -exec cat {} + 2>/dev/null | tail -n 200 || true
          find build/ios -name "*.log" -exec cat {} + 2>/dev/null | tail -n 200 || true
