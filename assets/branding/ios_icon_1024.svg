<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bgG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2D1C12"/>
      <stop offset="100%" stop-color="#180E09"/>
    </linearGradient>
  </defs>
  <rect width="1024" height="1024" rx="0" fill="url(#bgG)"/>
  <rect x="72" y="72" width="880" height="880" rx="180" fill="none" stroke="#F59E0B" stroke-width="4" stroke-opacity="0.3"/>
  <rect x="88" y="88" width="848" height="848" rx="166" fill="none" stroke="#F59E0B" stroke-width="1.5" stroke-opacity="0.18"/>
  
    
    <linearGradient id="goldG" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>
    <linearGradient id="innerPageG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FEF08A"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    
    <g transform="translate(512 512) scale(1.0)">
      <!-- Mihrab Horseshoe Arch -->
      <path d="M-220,240 L-220,-20 C-220,-160 -120,-260 0,-260 C120,-260 220,-160 220,-20 L220,240" 
            fill="none" stroke="url(#goldG)" stroke-width="18" stroke-linecap="round"/>
      
      <!-- Outer cusp arch -->
      <path d="M-260,240 L-260,-20 C-260,-190 -140,-300 0,-300 C140,-300 260,-190 260,-20 L260,240" 
            fill="none" stroke="url(#goldG)" stroke-width="6" stroke-opacity="0.45"/>

      <!-- Sacred Lantern / Lamp hanging from arch -->
      <line x1="0" y1="-260" x2="0" y2="-170" stroke="url(#goldG)" stroke-width="6"/>
      <path d="M-36,-170 L36,-170 L24,-100 L0,-70 L-24,-100 Z" fill="url(#goldG)"/>
      <circle cx="0" cy="-120" r="14" fill="#FEF08A"/>
      
      <!-- Gentle radiating light rays -->
      <line x1="-50" y1="-120" x2="-80" y2="-120" stroke="#FEF08A" stroke-width="4" stroke-linecap="round" stroke-opacity="0.6"/>
      <line x1="50" y1="-120" x2="80" y2="-120" stroke="#FEF08A" stroke-width="4" stroke-linecap="round" stroke-opacity="0.6"/>
      <line x1="-38" y1="-75" x2="-62" y2="-55" stroke="#FEF08A" stroke-width="4" stroke-linecap="round" stroke-opacity="0.6"/>
      <line x1="38" y1="-75" x2="62" y2="-55" stroke="#FEF08A" stroke-width="4" stroke-linecap="round" stroke-opacity="0.6"/>

      <!-- Open Manuscript (Book of Knowledge) -->
      <!-- Left page -->
      <path d="M-10,40 C-80,20 -150,30 -190,60 L-190,200 C-150,170 -80,160 -10,180 Z" 
            fill="url(#goldG)"/>
      <path d="M-20,60 C-80,45 -135,55 -170,80 L-170,185 C-135,160 -80,150 -20,165 Z" 
            fill="#3D2415"/>
      <!-- Right page -->
      <path d="M10,40 C80,20 150,30 190,60 L190,200 C150,170 80,160 10,180 Z" 
            fill="url(#goldG)"/>
      <path d="M20,60 C80,45 135,55 170,80 L170,185 C135,160 80,150 20,165 Z" 
            fill="#3D2415"/>

      <!-- Spine & Stand -->
      <polygon points="0,55 -12,215 12,215" fill="#FEF08A"/>
      <path d="M-60,225 L0,195 L60,225 L0,250 Z" fill="url(#goldG)"/>

      <!-- 8-point star finial -->
      <g transform="translate(0, -325) scale(0.65)">
        <polygon points="0,-35 10,-10 35,0 10,10 0,35 -10,10 -35,0 -10,-10" fill="#FEF08A"/>
      </g>
    </g>
    
</svg>