schema: spec-driven

# Project context
context: |
  Talib Ilm: Islamic knowledge Flutter app (Arabic-only RTL, Light & Dark modes).
  Visual layer rules: All styling uses tokens from lib/app/theme/, text contrast >= 4.5:1, UI >= 3.0:1.
  RTL-first: EdgeInsetsDirectional, AlignmentDirectional.
  Files strictly under 600 lines.
  Quality gates: flutter analyze --no-pub, python tool/ui_lint_v2.py, flutter test.

